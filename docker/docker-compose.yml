services:
  omnipos-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sql_server_container
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Dssmd@4omni
      - MSSQL_PID=developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./sqlserver/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mssql_data:
    driver: local
